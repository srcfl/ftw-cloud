name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # The local inspection route exists only under this tag; the suite
      # must pass with it too, and TestNoRouteReadsAHome must pass without.
      - run: go test -count=1 -tags ftwclouddev ./...
      - name: Exact Core handlers for the measurement diagnostics integration
        uses: actions/checkout@v5
        with:
          repository: srcfl/ftw
          ref: bf80760fb4d11698ca09e76f22ce44cf347b78df
          path: .core-integration
          persist-credentials: false
      - name: MCP measurement diagnostics through real Core handlers and SQLite
        env:
          FTW_CORE_CHECKOUT: ${{ github.workspace }}/.core-integration
        run: go test -race -count=1 -run '^TestMeasurementDiagnosticsAgainstRealCoreHandlers$' ./internal/mcp
      - name: FTW Cloud imports only the wire format from srcfl/ftw
        run: bash scripts/check-imports.sh
      - name: What a box can send never panics the service
        run: go test -run XXX -fuzz FuzzBoxMessage -fuzztime 30s ./internal/uplink
      - name: What a watch can post never panics the service
        run: go test -run XXX -fuzz FuzzOnceMessage -fuzztime 30s ./internal/appsession
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The official MCP inspector lists and calls tools on /mcp
        env:
          MCP_INSPECTOR: npx -y @modelcontextprotocol/inspector@2.3.0
        run: go test -count=1 -run TestInspectorSmoke -v ./internal/mcp
      - name: Builds for the host
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/ftwcloudd
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/ftwkeysd
