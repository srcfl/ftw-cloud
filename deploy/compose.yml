# FTW Cloud on one small instance. Nothing deploys this by itself.
#
# One container, and no TLS terminator in front of it: each box binds its
# handshake to the TLS session it opened, so ftwcloudd ends TLS itself. The
# relay can sit behind Caddy because what it carries is Noise inside; this
# service reads what it carries, so the box checks that nobody in between
# can. A TCP load balancer is fine; an HTTP one is not.

name: ftw-cloud

services:
  ftwcloudd:
    image: ${FTW_CLOUD_IMAGE:?set FTW_CLOUD_IMAGE to an image digest}
    restart: unless-stopped
    ports:
      - '443:443'
      # HTTP/3 for the plain HTTPS routes (deploy/http3.md). The security
      # group must let UDP 443 in before this runs.
      - '443:443/udp'
    command:
      - -listen=:443
      - -h3=${FTW_CLOUD_H3:-true}
      - -quic-sessions=${FTW_CLOUD_QUIC_SESSIONS:-true}
      - -domain=cloud.ftw.energy
      - -state=/state
      - -service-key=/run/secrets/ftw-cloud-service.key
      - -acme-email=${FTW_CLOUD_ACME_EMAIL:-}
      - -noise-key=/run/secrets/noise/noise.key
      - -keys-socket=/run/ftw-cloud-keys/keys.sock
    environment:
      # /source publishes it, so anyone can compare it with what CI built.
      FTW_CLOUD_IMAGE: ${FTW_CLOUD_IMAGE}
      # The host has 2 GiB. Near this the garbage collector works harder
      # instead of letting the heap grow into the kernel's OOM killer.
      GOMEMLIMIT: 1400MiB
    # On SIGTERM the service closes every socket with 4503 and a spread,
    # lets queued alerts go, and exits; give it the time (deploy/README.md,
    # "Deploys").
    stop_grace_period: 15s
    volumes:
      # The registry and certificates. No readings are ever written here.
      - ftw-cloud-state:/state
      # Apple's push key, read from Parameter Store into tmpfs at boot by
      # deploy/apns.sh. Empty means no alerts, and the service runs.
      - /run/ftw-cloud/apns:/run/secrets/apns:ro
      # The Noise key phones dial, read from Parameter Store into tmpfs at
      # boot by deploy/noise.sh. Empty means /v1/app is off, and the
      # service runs.
      - /run/ftw-cloud/noise:/run/secrets/noise:ro
      # The keys part's socket (deploy/keys.md). Without ftwkeysd it holds
      # nothing, and assistants cannot connect.
      - /run/ftw-cloud-keys:/run/ftw-cloud-keys
    secrets:
      - ftw-cloud-service.key
    # /healthz over TCP and HTTP/3 on the container's own port, with the
    # certificate's name. Docker shows the result; nothing restarts on it.
    healthcheck:
      test: ['CMD', '/usr/local/bin/ftwcloudd', 'health', '-name', 'cloud.ftw.energy', '-h3=${FTW_CLOUD_H3:-true}', 'https://127.0.0.1/healthz']
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    # Household readings live in memory. No core file may carry them out.
    ulimits:
      core: 0
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # The keys part: the only process that can act on a home, as an agent its
  # owner approved (deploy/keys.md). It starts with COMPOSE_PROFILES=agents
  # in compose.env, once the KMS keys and the keys role exist.
  ftwkeysd:
    image: ${FTW_CLOUD_IMAGE:?set FTW_CLOUD_IMAGE to an image digest}
    profiles: [agents]
    restart: unless-stopped
    entrypoint: ['/usr/local/bin/ftwkeysd']
    command:
      - -socket=/run/ftw-cloud-keys/keys.sock
      - -state=/keys
      - -kms-key=${FTW_CLOUD_KMS_KEY:-}
      - -offer-kms-key=${FTW_CLOUD_OFFER_KEY:-}
      - -region=eu-north-1
      - -aws-credentials=/run/secrets/aws/credentials.json
      # ftwcloudd's user, the only one allowed on the socket.
      - -peer-uid=65530
    # Its own user, in ftwcloudd's group so that ftwcloudd may connect to
    # the socket and nothing more.
    user: '65533:65530'
    # A network of its own, apart from ftwcloudd's. Like every container it
    # cannot reach the instance's credentials (hop limit 1); it reaches KMS
    # with the keys role's short-lived credentials, which may use the two
    # KMS keys and nothing else. It listens on nothing but the unix socket.
    networks: [keys]
    volumes:
      # Agent keys, sealed under KMS. ftwcloudd never mounts this.
      - ftw-cloud-keys:/keys
      - /run/ftw-cloud-keys:/run/ftw-cloud-keys
      # The keys role's credentials, renewed by the host every 15 minutes
      # (deploy/keys.sh).
      - /run/ftw-cloud-keys-aws:/run/secrets/aws:ro
    read_only: true
    ulimits:
      core: 0
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

secrets:
  # ftw-cloud-key.service fetches it from Secrets Manager into tmpfs at
  # boot; it is never in the image, the volume or on disk.
  ftw-cloud-service.key:
    file: /run/ftw-cloud/service.key

networks:
  keys:

volumes:
  ftw-cloud-state:
  ftw-cloud-keys:
